name: Render TikTok Skit

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "Render quality (1-100, higher = better/slower)"
        required: false
        default: "80"
      concurrency:
        description: "Render concurrency"
        required: false
        default: "4"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render video
        run: |
          mkdir -p dist
          npx remotion render Skit "dist/mwalimuease-tiktok-skit.mp4" \
            --concurrency="${{ github.event.inputs.concurrency || '4' }}" \
            --jpeg-quality="${{ github.event.inputs.quality || '80' }}" \
            --log=info

      - name: Probe output
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -show_format -show_streams "dist/mwalimuease-tiktok-skit.mp4" | tee dist/probe.txt

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mwalimuease-tiktok-skit
          path: |
            dist/mwalimuease-tiktok-skit.mp4
            dist/probe.txt
          retention-days: 30

      - name: Upload render log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-failure-info
          path: dist/
